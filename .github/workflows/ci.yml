name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-format:
    name: Backend Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend solution
        run: dotnet restore backend.sln

      - name: Verify backend formatting
        run: dotnet format backend.sln --verify-no-changes --no-restore

  frontend-format:
    name: Frontend Format
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend formatting
        run: npm run format:check

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
      - name: Generate frontend environment
        run: npm run generate:env


      - name: Build frontend
        run: npm run build

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
      - name: Generate frontend environment
        run: npm run generate:env


      - name: Type-check frontend
        run: npm run typecheck

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
      - name: Generate frontend environment
        run: npm run generate:env


      - name: Run frontend unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run unit tests with coverage gate
        run: dotnet run --project tools/Event.DevTasks/Event.DevTasks.csproj -- backend-unit-coverage

  backend-integration-tests:
    name: Backend Integration Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: authentication
            filter: FullyQualifiedName~backend.tests.Integration.Features.Auth
          - shard: clubs
            filter: FullyQualifiedName~backend.tests.Integration.Features.Clubs|FullyQualifiedName~backend.tests.Clubs
          - shard: events
            filter: FullyQualifiedName~backend.tests.Integration.Features.Events|FullyQualifiedName~backend.tests.Events
          - shard: other
            filter: FullyQualifiedName!~backend.tests.Integration.Features.Auth&FullyQualifiedName!~backend.tests.Integration.Features.Clubs&FullyQualifiedName!~backend.tests.Clubs&FullyQualifiedName!~backend.tests.Integration.Features.Events&FullyQualifiedName!~backend.tests.Events

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify Docker availability
        run: docker version

      - name: Run integration tests
        run: dotnet run --project tools/Event.DevTasks/Event.DevTasks.csproj -- backend-integration-tests --filter "${{ matrix.filter }}"

  backend-integration-endpoint-coverage:
    name: Backend Integration Endpoint Coverage
    needs: backend-integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run integration endpoint coverage audit
        run: dotnet run --project tools/Event.DevTasks/Event.DevTasks.csproj -- backend-integration-endpoint-coverage --fail-on-missing
