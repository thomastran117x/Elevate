version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Angular framework packages peer-depend on each other at EXACT versions
      # (@angular/platform-browser@21.2.19 requires @angular/core@21.2.19, not a
      # range), so they must be bumped together. Do not split this group -- a PR
      # moving only some of them cannot resolve.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      ngrx:
        patterns:
          - "@ngrx/*"
      frontend-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngrx/*"
        update-types:
          - minor
          - patch
    ignore:
      # Angular constrains the TypeScript range tightly (v21 wants >=5.9 <6.1)
      # while TypeScript latest is already 7.x. TypeScript majors move as part of
      # an Angular upgrade via `ng update`, never on their own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Angular 21 peer-requires zone.js ~0.15.0; 0.16.x belongs to the v22 upgrade.
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
