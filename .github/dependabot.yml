version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Angular framework packages peer-depend on each other at EXACT versions
      # (@angular/platform-browser@21.2.19 requires @angular/core@21.2.19, not a
      # range), so they must be bumped together. Do not split this group -- a PR
      # moving only some of them cannot resolve.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      ngrx:
        patterns:
          - "@ngrx/*"
      frontend-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngrx/*"
        update-types:
          - minor
          - patch
    ignore:
      # @angular/build@22.x peer-requires typescript ">=6.0 <6.1" while TypeScript
      # latest is already 7.x, so every major PR here is unmergeable. TypeScript
      # moves as part of an Angular upgrade via `ng update`, never on its own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node runtime major, which is pinned to 24 by
      # .nvmrc, package.json engines, the Dockerfile and CI. It must not drift
      # ahead of the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # jasmine-core 7 defines `describe` as a read-only global, but zone.js/testing
      # (loaded by the Karma builder) reassigns it, so every spec file fails to load.
      # Revisit once zone.js supports it or the tests move off Karma/Jasmine.
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      backend-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x is compiled against Microsoft.OpenApi 2.x; the 3.x
      # major is binary-incompatible (every backend test failed on it). It moves with the next
      # ASP.NET Core major, never on its own.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # ImageSharp 4.x fails every Release build without a Six Labors license key (an MSBuild
      # check that runs before compile). Moving to it means provisioning a key in CI and the
      # Docker build first; 3.x patch releases still arrive through the group above.
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]