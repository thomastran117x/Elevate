<button
  type="button"
  [class]="buttonClass"
  [disabled]="pending || disabled"
  [attr.aria-pressed]="favourited"
  [attr.aria-label]="accessibleLabel"
  [attr.title]="accessibleLabel"
  (click)="activate($event)"
  (keyup.enter)="activate($event)"
>
  <svg
    [class]="iconClass"
    viewBox="0 0 24 24"
    [attr.fill]="favourited ? 'currentColor' : 'none'"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path
      d="M12 3.75l2.6 5.27 5.82.85-4.21 4.1.99 5.79L12 17.02l-5.2 2.74.99-5.79-4.21-4.1 5.82-.85L12 3.75z"
    />
  </svg>
</button>
