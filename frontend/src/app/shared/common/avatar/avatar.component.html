@if (src) {
  <img
    [src]="src"
    [alt]="label"
    [title]="label"
    loading="lazy"
    class="shrink-0 rounded-full border border-line object-cover"
    [class]="classes"
  />
} @else {
  <span
    [title]="label"
    aria-hidden="true"
    class="inline-flex shrink-0 items-center justify-center rounded-full bg-accent font-bold text-accent-contrast select-none"
    [class]="classes"
    >{{ initials }}</span
  >
}
