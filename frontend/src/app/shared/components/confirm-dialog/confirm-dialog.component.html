@if (open) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    (click)="onBackdropClick($event)"
  >
    <div class="w-full max-w-md rounded-2xl border border-line-strong bg-surface p-6 shadow-xl">
      <h3
        id="confirm-dialog-title"
        class="text-lg font-bold tracking-tight"
        [class.text-danger]="tone === 'danger'"
      >
        {{ title }}
      </h3>

      @if (body) {
        <p class="mt-3 text-sm text-muted">{{ body }}</p>
      }

      @if (impacts.length) {
        <ul class="mt-4 space-y-2">
          @for (impact of impacts; track impact) {
            <li class="flex gap-2 text-sm text-muted">
              <span
                aria-hidden="true"
                class="mt-1.5 size-1.5 shrink-0 rounded-full bg-subtle"
              ></span>
              <span>{{ impact }}</span>
            </li>
          }
        </ul>
      }

      @if (reversibleNote) {
        <p
          class="mt-4 rounded-2xl border border-line bg-glass-strong px-4 py-3 text-xs font-semibold text-subtle"
        >
          {{ reversibleNote }}
        </p>
      }

      @if (requireTypedConfirmation) {
        <label class="mt-5 block">
          <span class="block text-xs font-semibold text-subtle">
            Type <span class="text-content">{{ requireTypedConfirmation }}</span> to confirm
          </span>
          <input
            type="text"
            name="typedConfirmation"
            autocomplete="off"
            [(ngModel)]="typedConfirmation"
            [disabled]="busy"
            class="mt-2 w-full rounded-2xl border border-line bg-glass-strong px-4 py-3 text-base text-content placeholder:text-faint outline-none transition focus:border-accent focus:ring-4 focus:ring-accent/15"
          />
        </label>
      }

      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button
          #cancelButton
          type="button"
          [disabled]="busy"
          (click)="dismiss()"
          class="rounded-2xl border border-line-strong px-5 py-3 text-sm font-semibold text-muted transition hover:bg-glass-strong disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ cancelLabel }}
        </button>

        <button
          type="button"
          [disabled]="!canConfirm"
          (click)="confirm()"
          [class]="
            tone === 'danger'
              ? 'rounded-2xl bg-rose-600 px-5 py-3 text-sm font-semibold text-accent-contrast transition hover:bg-rose-700 disabled:cursor-not-allowed disabled:opacity-40'
              : 'rounded-2xl bg-accent px-5 py-3 text-sm font-semibold text-accent-contrast transition hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-40'
          "
        >
          {{ busy ? 'Working…' : confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
