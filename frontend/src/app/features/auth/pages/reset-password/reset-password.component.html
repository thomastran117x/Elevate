<div class="min-h-screen bg-surface text-content flex items-center justify-center p-6">
  <div class="w-full max-w-md rounded-3xl border border-line bg-glass p-8 backdrop-blur">
    <h1 class="text-3xl font-bold">Choose a new password</h1>
    <p class="mt-2 text-sm text-muted">
      @if (challenge) {
        Enter the six-digit code from your email and choose a new password.
      } @else {
        Choose a new password for your account.
      }
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
      @if (challenge) {
        <div>
          <label for="reset-code" class="mb-1 block text-sm font-medium text-muted"
            >Six-digit code</label
          >
          <input
            id="reset-code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            formControlName="code"
            class="w-full rounded-xl border border-line bg-surface-sunken px-4 py-3 outline-none"
          />
        </div>
      }
      <div>
        <label for="new-password" class="mb-1 block text-sm font-medium text-muted"
          >New password</label
        >
        <input
          id="new-password"
          type="password"
          autocomplete="new-password"
          formControlName="password"
          class="w-full rounded-xl border border-line bg-surface-sunken px-4 py-3 outline-none"
        />
      </div>
      <div>
        <label for="confirm-password" class="mb-1 block text-sm font-medium text-muted"
          >Confirm password</label
        >
        <input
          id="confirm-password"
          type="password"
          autocomplete="new-password"
          formControlName="confirmPassword"
          class="w-full rounded-xl border border-line bg-surface-sunken px-4 py-3 outline-none"
        />
      </div>

      @if (error) {
        <div class="text-sm text-danger" role="alert">{{ error }}</div>
      }
      @if (success) {
        <div class="text-sm text-success" role="status">{{ success }}</div>
      }

      <button
        type="submit"
        [disabled]="loading || (!token && !challenge)"
        class="w-full rounded-xl bg-inverse px-4 py-3 font-semibold text-inverse-content disabled:opacity-60"
      >
        {{ loading ? 'Updating password...' : 'Update password' }}
      </button>
    </form>

    <p class="mt-5 text-sm text-subtle">
      Back to <a routerLink="/auth/login" class="text-content underline">sign in</a>
    </p>
  </div>
</div>
