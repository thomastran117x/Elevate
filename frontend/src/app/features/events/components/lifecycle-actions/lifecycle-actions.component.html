@if (transitions.length) {
  <div class="flex flex-wrap gap-3">
    @for (transition of transitions; track transition.key) {
      <button
        type="button"
        [disabled]="busy || isBlocked(transition)"
        [title]="blockedReason(transition)"
        (click)="request(transition)"
        [class]="buttonClass(transition)"
      >
        {{ transition.label }}
      </button>
    }
  </div>

  @if (layout === 'full') {
    @for (transition of transitions; track transition.key) {
      @if (blockedReason(transition); as reason) {
        <p class="mt-3 text-xs font-semibold text-amber-700 dark:text-amber-300">{{ reason }}</p>
      }
    }
  }
}

<app-confirm-dialog
  [open]="!!pending"
  [title]="pending?.title ?? ''"
  [impacts]="pending?.impacts ?? []"
  [reversibleNote]="pending?.reversibleNote ?? null"
  [confirmLabel]="pending?.label ?? 'Confirm'"
  cancelLabel="Keep as is"
  [tone]="pending?.isDestructive ? 'danger' : 'primary'"
  [busy]="busy"
  (resolve)="onResolve($event)"
/>
